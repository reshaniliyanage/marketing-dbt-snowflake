version: 2

sources:
  - name: marketing
    description: "Raw marketing schema tables from Snowflake"
    database: RESHANIPROJECTS
    schema: MARKETING
    tables:

      - name: campaign_events
        description: "Events from marketing campaigns"
        columns:
          - name: event_id
            description: "Unique identifier for each campaign event"
            tests:
              - unique
              - not_null
          - name: customer_id
            description: "ID of the customer related to the event"
            tests:
              - not_null
          - name: campaign_name
            description: "Name of the campaign associated with the event"
            tests:
              - not_null
          - name: channel
            description: "Channel used in the campaign (e.g., email, sms)"
          - name: event_type
            description: "Type of event"
            tests:
              - not_null
              - accepted_values:
                  values: ['sent', 'open', 'click', 'bounce']
          - name: event_ts
            description: "Timestamp when the event occurred"
            tests:
              - not_null

      - name: customers
        description: "Customer information including consent and signup data"
        columns:
          - name: customer_id
            description: "Unique customer identifier"
            tests:
              - unique
              - not_null
          - name: email
            description: "Customer email address"
            tests:
              - not_null
          - name: marketing_consent
            description: "Customer marketing consent status"
            tests:
              - not_null
          - name: signup_date
            description: "Date the customer signed up"
            tests:
              - not_null
          - name: country
            description: "Country of the customer"

      - name: receipts
        description: "Customer purchase receipts"
        columns:
          - name: receipt_id
            description: "Unique receipt identifier"
            tests:
              - unique
              - not_null
          - name: customer_id
            description: "Customer who made the purchase"
            tests:
              - not_null
          - name: store_id
            description: "Store where purchase was made"
            tests:
              - not_null
          - name: purchase_ts
            description: "Timestamp of the purchase"
            tests:
              - not_null
          - name: total_amount
            description: "Total amount spent on receipt"
            tests:
              - not_null

      - name: receipt_items
        description: "Individual items purchased on receipts"
        columns:
          - name: receipt_id
            description: "Identifier of the receipt"
            tests:
              - not_null
          - name: product_id
            description: "Product identifier"
            tests:
              - not_null
          - name: category
            description: "Category of the product"
          - name: price
            description: "Price of the product"

      - name: stores
        description: "Store details"
        columns:
          - name: store_id
            description: "Unique store identifier"
            tests:
              - unique
              - not_null
          - name: store_name
            description: "Name of the store"
            tests:
              - not_null
          - name: city
            description: "City where the store is located"
          - name: country
            description: "Country of the store"
